[package]
name = "vareq-portaldot-native-fixture"
version = "0.1.0"
authors = ["Vareq contributors"]
edition = "2021"
publish = false
license = "MIT"

[dependencies]
ink = { package = "ink_lang", version = "=3.3.1", default-features = false }
ink_lang = { version = "=3.3.1", default-features = false }
ink_metadata = { version = "=3.3.1", default-features = false }
ink_env = { version = "=3.3.1", default-features = false }
ink_storage = { version = "=3.3.1", default-features = false }
ink_primitives = { version = "=3.3.1", default-features = false }
scale = { package = "parity-scale-codec", version = "3.6.12", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = ["ink/std", "ink_lang/std", "ink_metadata/std", "ink_env/std", "ink_storage/std", "ink_primitives/std", "scale/std", "scale-info/std"]
ink-as-dependency = []