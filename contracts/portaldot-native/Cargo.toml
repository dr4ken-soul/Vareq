[package]
name = "vareq-portaldot-native-fixture"
version = "0.1.0"
authors = ["Vareq contributors"]
edition = "2021"
publish = false
license = "MIT"

[dependencies]
ink_lang = { version = "=3.3.1", default-features = false }
ink_metadata = { version = "=3.3.1" }
ink_env = { version = "=3.3.1", default-features = false }
ink_storage = { version = "=3.3.1", default-features = false }
ink_primitives = { version = "=3.3.1", default-features = false }
scale = { package = "parity-scale-codec", version = "=3.1.2", default-features = false, features = ["derive"] }
parity-scale-codec-derive = "=3.1.2"
scale-info = { version = "=2.1.2", default-features = false, features = ["derive"] }
scale-info-derive = "=2.1.2"

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = ["ink_lang/std", "ink_metadata/std", "ink_env/std", "ink_storage/std", "ink_primitives/std", "scale/std", "scale-info/std"]
ink-as-dependency = []
