<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="02 / PROBLEM reference composition"><rect width="1600" height="900" fill="#E5EAE4"/><text x="110" y="155" font-family="DM Mono,monospace" font-size="14" font-weight="500" letter-spacing="2" fill="#586C5C">02 / PROBLEM</text><foreignObject x="110" y="220" width="780" height="260"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Bricolage Grotesque,system-ui,sans-serif;font-size:64px;font-weight:600;line-height:1.04;letter-spacing:-.04em;color:#1C281E">The gap between events is part of the attack surface.</div></foreignObject><foreignObject x="112" y="520" width="700" height="180"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Source Sans 3,system-ui,sans-serif;font-size:25px;line-height:1.5;color:#4C5F50">A refund can become valid while a fill message is still in flight.</div></foreignObject></svg>
