<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="06 / TRUST &amp; LIMITS reference composition"><rect width="1600" height="900" fill="#F1F4F0"/><text x="110" y="155" font-family="DM Mono,monospace" font-size="14" font-weight="500" letter-spacing="2" fill="#586C5C">06 / TRUST &amp; LIMITS</text><foreignObject x="110" y="220" width="780" height="260"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Bricolage Grotesque,system-ui,sans-serif;font-size:64px;font-weight:600;line-height:1.04;letter-spacing:-.04em;color:#1C281E">A useful trace is honest about its limits.</div></foreignObject><foreignObject x="112" y="520" width="700" height="180"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Source Sans 3,system-ui,sans-serif;font-size:25px;line-height:1.5;color:#4C5F50">Bounded scenarios. Controlled local replay. Public-chain uncertainty. Trusted coordinator assumptions.</div></foreignObject><path d="M740 195H1470" stroke="#7F9583"/><text x="740" y="250" font-family="Bricolage Grotesque,system-ui,sans-serif" font-size="25" font-weight="600" fill="#1C281E">AI proposes; tests decide.</text><text x="740" y="285" font-family="DM Mono,monospace" font-size="13" fill="#586C5C">DISCLOSURE 01</text><path d="M740 325H1470" stroke="#7F9583"/><text x="740" y="380" font-family="Bricolage Grotesque,system-ui,sans-serif" font-size="25" font-weight="600" fill="#1C281E">Local replay is controlled.</text><text x="740" y="415" font-family="DM Mono,monospace" font-size="13" fill="#586C5C">DISCLOSURE 02</text><path d="M740 455H1470" stroke="#7F9583"/><text x="740" y="510" font-family="Bricolage Grotesque,system-ui,sans-serif" font-size="25" font-weight="600" fill="#1C281E">Public chains are not deterministic.</text><text x="740" y="545" font-family="DM Mono,monospace" font-size="13" fill="#586C5C">DISCLOSURE 03</text><path d="M740 585H1470" stroke="#7F9583"/><text x="740" y="640" font-family="Bricolage Grotesque,system-ui,sans-serif" font-size="25" font-weight="600" fill="#1C281E">The mitigation trusts a coordinator.</text><text x="740" y="675" font-family="DM Mono,monospace" font-size="13" fill="#586C5C">DISCLOSURE 04</text></svg>
