name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test --root contracts

  native-portaldot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy, rust-src
          targets: wasm32-unknown-unknown
      - name: Install cargo-contract v1.5 lint tools
        run: |
          rustup toolchain install stable
          rustup run stable cargo install --locked cargo-dylint dylint-link
      - run: cargo test --manifest-path contracts/portaldot-native/Cargo.toml
      - run: cargo install cargo-contract --version 1.5.0 --locked
      - run: cargo contract build --release --manifest-path contracts/portaldot-native/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: vareq-portaldot-native-bundle
          path: contracts/portaldot-native/target/**/*.contract
          if-no-files-found: error
          retention-days: 7
