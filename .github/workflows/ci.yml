name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test --root contracts

  native-portaldot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy, rust-src
          targets: wasm32-unknown-unknown
      - run: cargo +1.85.0 test --manifest-path contracts/portaldot-native/Cargo.toml
      - name: Report edition 2024 crates in legacy contract metadata
        run: |
          cargo +1.85.0 metadata --format-version 1 --manifest-path contracts/portaldot-native/Cargo.toml > /tmp/vareq-contract-metadata.json
          python3 -c 'import json; d=json.load(open("/tmp/vareq-contract-metadata.json")); print("\n".join(f"{p[\"name\"]} {p[\"version\"]} ({p[\"manifest_path\"]})" for p in d["packages"] if p.get("edition") == "2024") or "No edition 2024 packages found")'
      - name: Install the legacy ink! linter runner
        run: |
          cargo +1.85.0 install cargo-dylint --version 4.0.1 --locked
          cargo +1.85.0 install dylint-link --version 4.0.1 --locked
      - name: Install the legacy ink! builder toolchain
        run: rustup toolchain install nightly-2022-06-30 --profile minimal --component llvm-tools-preview --component rust-src --component rustc-dev
      - name: Install cargo-contract compatible with ink! 3
        run: cargo +nightly-2022-06-30 install cargo-contract --version 1.5.0 --locked
      - name: Install the wasm build toolchain
        run: rustup toolchain install nightly-2025-02-20 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - name: Install Binaryen for the legacy contract optimizer
        run: sudo apt-get update && sudo apt-get install --yes binaryen
      - name: Build Portaldot V3-compatible contract bundle
        run: cargo +nightly-2025-02-20 contract build --release --skip-linting --manifest-path contracts/portaldot-native/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: vareq-portaldot-native-bundle
          path: contracts/portaldot-native/target/**/*.contract
          if-no-files-found: error
          retention-days: 7